
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESCAPE</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  background: #050b13;
  font-family: Arial, sans-serif;
  cursor: none;
  color: white;
  touch-action: none;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

#cursor {
  position: fixed;
  width: 7px;
  height: 7px;
  background: #55eaff;
  border-radius: 50%;
  pointer-events: none;
  z-index: 20;
  box-shadow: 0 0 12px #55eaff, 0 0 24px #55eaff;
  transform: translate(-50%, -50%);
}

#progress {
  position: fixed;
  top: 22px;
  left: 50%;
  transform: translateX(-50%);
  width: min(360px, 65vw);
  height: 5px;
  background: #172635;
  border-radius: 20px;
  overflow: hidden;
  z-index: 5;
}

#bar {
  height: 100%;
  width: 0%;
  background: #40dfff;
  box-shadow: 0 0 12px #40dfff;
  transition: width .12s;
}

#count {
  position: fixed;
  top: 38px;
  left: 50%;
  transform: translateX(-50%);
  color: #75eaff;
  font-size: 12px;
  letter-spacing: 3px;
  z-index: 5;
}

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(3, 9, 17, .94);
  z-index: 10;
  text-align: center;
}

.hidden {
  display: none;
}

h1 {
  font-size: clamp(48px, 10vw, 90px);
  letter-spacing: 12px;
  color: #eafaff;
  text-shadow: 0 0 18px #1cbce8;
  margin-bottom: 18px;
}

.subtitle {
  color: #7c9baa;
  font-size: 12px;
  letter-spacing: 4px;
  margin-bottom: 35px;
}

button {
  padding: 14px 45px;
  border: 1px solid #43dfff;
  background: transparent;
  color: #67eaff;
  font-size: 13px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: .25s;
}

button:hover {
  background: #43dfff;
  color: #06101a;
  box-shadow: 0 0 25px #43dfff;
  transform: translateY(-3px);
}

.credit {
  margin-top: 30px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
}

.credit small {
  font-size: 9px;
  letter-spacing: 4px;
  color: #607b8b;
}

.credit strong {
  font-size: 13px;
  letter-spacing: 3px;
  color: #a8eaff;
}

#hint {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  color: #547080;
  font-size: 10px;
  letter-spacing: 2px;
  z-index: 4;
  white-space: nowrap;
}
</style>
</head>

<body>

<canvas id="game"></canvas>
<div id="cursor"></div>

<div id="progress"><div id="bar"></div></div>
<div id="count">0 / 1000</div>
<div id="hint">MOVE YOUR MOUSE TO ESCAPE</div>

<div class="screen" id="startScreen">
  <h1>ESCAPE</h1>
  <div class="subtitle">COLLECT THE LIGHTS · AVOID THE ENEMIES</div>
  <button id="startBtn">START GAME</button>
</div>

<div class="screen hidden" id="loseScreen">
  <h1 style="font-size:clamp(42px,8vw,72px)">YOU LOST</h1>
  <button id="replayBtn">REPLAY</button>
  <div class="credit">
    <small>CREATE BY</small>
    <strong>SOFIAVU0402</strong>
  </div>
</div>

<div class="screen hidden" id="winScreen">
  <h1 style="font-size:clamp(42px,8vw,72px)">YOU WIN</h1>
  <div class="subtitle">ALL 1000 LIGHTS COLLECTED</div>
  <button id="againBtn">PLAY AGAIN</button>
  <div class="credit">
    <small>CREATE BY</small>
    <strong>SOFIAVU0402</strong>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const cursor = document.getElementById("cursor");
const bar = document.getElementById("bar");
const countText = document.getElementById("count");

const startScreen = document.getElementById("startScreen");
const loseScreen = document.getElementById("loseScreen");
const winScreen = document.getElementById("winScreen");

let W, H;
let running = false;
let collected = 0;

const MAX = 1000;

let mouse = {
  x: innerWidth / 2,
  y: innerHeight / 2
};

let player = {
  x: innerWidth / 2,
  y: innerHeight / 2
};

let target = { x: 200, y: 200 };

let enemies = [];
let particles = [];
let stars = [];

let animationTime = 0;

// Bí mật
let secretTapCount = 0;
let secretTapTimer = null;

function resize() {
  const dpr = devicePixelRatio || 1;

  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  W = innerWidth;
  H = innerHeight;
}

resize();
addEventListener("resize", resize);

addEventListener("mousemove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;

  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});

function randomTarget() {
  target.x = 35 + Math.random() * (W - 70);
  target.y = 60 + Math.random() * (H - 100);
}

function makeEnemies() {
  enemies = [];

  for (let i = 0; i < 3; i++) {
    enemies.push({
      x: Math.random() * W,
      y: Math.random() * H,
      speed: 1.15 + Math.random() * .35,
      radius: 13,
      angle: Math.random() * Math.PI * 2,
      phase: Math.random() * 10
    });
  }
}

function makeStars() {
  stars = [];

  for (let i = 0; i < 90; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 1.5,
      alpha: .2 + Math.random() * .5
    });
  }
}

makeStars();

function resetSecret() {
  secretTapCount = 0;
  clearTimeout(secretTapTimer);
  secretTapTimer = null;
}

function resetGame() {
  resetSecret();

  collected = 0;

  player.x = W / 2;
  player.y = H / 2;

  mouse.x = W / 2;
  mouse.y = H / 2;

  particles = [];

  makeEnemies();
  randomTarget();

  bar.style.width = "0%";
  countText.textContent = "0 / 1000";

  startScreen.classList.add("hidden");
  loseScreen.classList.add("hidden");
  winScreen.classList.add("hidden");

  running = true;
}

function loseGame() {
  if (!running) return;

  running = false;
  resetSecret();

  loseScreen.classList.remove("hidden");
}

function winGame() {
  if (!running) return;

  running = false;
  resetSecret();

  winScreen.classList.remove("hidden");
}

// Công tắc bí mật
document.addEventListener("pointerdown", () => {
  if (!running) return;

  secretTapCount++;

  if (secretTapCount >= 2) {
    resetSecret();
    winGame();
    return;
  }

  clearTimeout(secretTapTimer);

  secretTapTimer = setTimeout(() => {
    secretTapCount = 0;
    secretTapTimer = null;
  }, 450);
});

function addParticles(x, y) {
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;

    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 1
    });
  }
}

function drawBackground() {
  ctx.fillStyle = "#050b13";
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = "#8ddfff";
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  ctx.globalAlpha = 1;

  ctx.strokeStyle = "rgba(70,150,190,.055)";
  ctx.lineWidth = 1;

  for (let x = 0; x < W; x += 45) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  for (let y = 0; y < H; y += 45) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function drawTarget() {
  ctx.save();

  ctx.shadowColor = "#10a6d8";
  ctx.shadowBlur = 16;

  ctx.beginPath();
  ctx.arc(target.x, target.y, 9, 0, Math.PI * 2);
  ctx.strokeStyle = "#10c9ff";
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.restore();
}

function drawPlayer() {
  ctx.save();

  ctx.shadowColor = "#6df4ff";
  ctx.shadowBlur = 22;

  ctx.beginPath();
  ctx.arc(player.x, player.y, 7, 0, Math.PI * 2);
  ctx.fillStyle = "#e9fcff";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(player.x, player.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = "#43dcff";
  ctx.fill();

  ctx.restore();
}

// Kẻ địch neon
function drawEnemies() {
  for (const e of enemies) {
    const pulse = Math.sin(animationTime * 0.004 + e.phase);
    const rotation = animationTime * 0.0015 + e.phase;

    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(rotation);

    // Vòng sáng bên ngoài
    ctx.shadowColor = "#ff315e";
    ctx.shadowBlur = 25;

    ctx.beginPath();
    ctx.arc(0, 0, 19 + pulse * 2, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,55,100,.25)";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Vòng năng lượng xoay
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0.3, Math.PI * 1.65);
    ctx.strokeStyle = "#ff416d";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, 0, 15, Math.PI + 0.3, Math.PI * 1.85);
    ctx.strokeStyle = "#ff9bad";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Lõi hình thoi
    ctx.rotate(-rotation * 2);

    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(9, 0);
    ctx.lineTo(0, 10);
    ctx.lineTo(-9, 0);
    ctx.closePath();

    ctx.fillStyle = "#ff315e";
    ctx.shadowBlur = 20;
    ctx.fill();

    ctx.strokeStyle = "#ff9aaf";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Tâm sáng
    ctx.beginPath();
    ctx.arc(0, 0, 3.5 + pulse * .5, 0, Math.PI * 2);
    ctx.fillStyle = "#fff0f4";
    ctx.shadowColor = "#ffffff";
    ctx.shadowBlur = 12;
    ctx.fill();

    ctx.restore();
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;
    p.life -= .035;

    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = "#5ceaff";
    ctx.fillRect(p.x, p.y, 3, 3);

    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }

  ctx.globalAlpha = 1;
}

function update() {
  if (!running) return;

  // Người chơi di chuyển theo chuột
  player.x += (mouse.x - player.x) * .12;
  player.y += (mouse.y - player.y) * .12;

  // Thu thập mục tiêu
  const dx = player.x - target.x;
  const dy = player.y - target.y;

  if (Math.hypot(dx, dy) < 17) {
    collected++;

    addParticles(target.x, target.y);
    randomTarget();

    bar.style.width = (collected / MAX * 100) + "%";
    countText.textContent = collected + " / 1000";

    if (collected >= MAX) {
      winGame();
      return;
    }
  }

  // Độ khó tăng dần
  const difficulty = collected / MAX;

  // Đầu game chậm, cuối game nhanh
  const speedMultiplier = 0.65 + difficulty * 3.2;

  // Kẻ địch đuổi theo người chơi
  for (const e of enemies) {
    const ex = player.x - e.x;
    const ey = player.y - e.y;

    const d = Math.hypot(ex, ey) || 1;

    const currentSpeed = e.speed * speedMultiplier;

    e.x += (ex / d) * currentSpeed;
    e.y += (ey / d) * currentSpeed;

    if (d < e.radius + 7) {
      loseGame();
      return;
    }
  }
}

function render() {
  drawBackground();

  if (running) {
    drawTarget();
    drawEnemies();
    drawPlayer();
  }

  updateParticles();
}

function loop(timestamp) {
  animationTime = timestamp || 0;

  update();
  render();

  requestAnimationFrame(loop);
}

document.getElementById("startBtn").onclick = resetGame;
document.getElementById("replayBtn").onclick = resetGame;
document.getElementById("againBtn").onclick = resetGame;

loop();
</script>

</body>
</html>
